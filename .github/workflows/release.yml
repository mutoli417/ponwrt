name: Release PonWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # =========================================================
      # 环境准备 —— 与 Build PonWrt 共用 .github/actions/setup-build-env
      #   差异通过 input 表达：
      #     deps-profile       full（Release 原来那套完整依赖）
      #     clean-level        basic（只删 3 个大件，不 prune docker / purge snapd）
      #     setup-swap         false（原来不建 swap）
      #     init-script        false（原来不跑 init 脚本）
      #     timezone           ""（原来不设时区）
      #     fail-on-apt-error  true（apt install 失败即退出）
      # =========================================================
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          deps-profile: full
          clean-level: basic
          setup-swap: 'false'
          init-script: 'false'
          timezone: ''
          fail-on-apt-error: 'true'

      - name: Cache downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config > .config
          make defconfig

      - name: Download sources
        run: |
          # 加 3 次重试；成功路径与原单次调用一致，失败更可恢复
          OK=0
          for i in 1 2 3; do
            echo "===== 第 $i 次尝试: make download ====="
            if make download -j"$(nproc)"; then OK=1; break; fi
            echo "::warning::第 $i 次 make download 失败，5 秒后重试"
            sleep 5
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::make download 连试 3 次仍失败"
            exit 1
          fi

      - name: Build ${{ matrix.target }}
        run: make -j"$(nproc)"

      - name: Pack ${{ matrix.target }}
        run: |
          # 先确认构建产物存在，避免 tar 在目录缺失时给出晦涩错误
          test -d "bin/targets/airoha/${{ matrix.target }}" || {
            echo "::error::构建产物目录 bin/targets/airoha/${{ matrix.target }} 不存在"
            exit 1
          }
          mkdir -p release
          tar --zstd -cf "release/ponwrt-${{ matrix.target }}.tar.zst" \
            -C bin/targets/airoha "${{ matrix.target }}"

      - name: Remove signing key material
        if: always()
        run: |
          # 构建结束后立即清理工作区残留的私钥/公钥材料，避免随工作区或缓存外泄
          rm -f private-key.pem public-key.pem
          echo "已清理工作区签名密钥材料"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum *.tar.zst > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.tar.zst
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

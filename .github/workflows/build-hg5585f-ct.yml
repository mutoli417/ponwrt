name: Build HG5585F CT

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-hg5585f-ct
  cancel-in-progress: false

jobs:
  build:
    name: Build an7581 HG5585F CT with SSR Plus+ and PassWall
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-hg5585f-ct-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-

      - name: Add helloworld feed and install feeds
        run: |
          # Append last so official feeds win on duplicate package names.
          echo 'src-git helloworld https://github.com/fw876/helloworld.git' >> feeds.conf.default
          echo '----- feeds.conf.default -----'
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          bash scripts/patch-luci-version.sh
          ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          bash scripts/gen-hg5585f-config.sh
          make defconfig
          # force VERSION_CODE (version.mk only reads CONFIG_VERSION_CODE)
          sed -i '/^CONFIG_VERSION_CODE=/d' .config 2>/dev/null || true
          sed -i '/^# CONFIG_VERSION_CODE is not set/d' .config 2>/dev/null || true
          echo 'CONFIG_VERSION_CODE="mutoli"' >> .config
          echo "----- target device -----"
          grep -E 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE' .config || true
          echo "----- plugin symbols -----"
          grep -E 'ssr-plus|passwall' .config || true
          echo "----- version -----"
          grep -E 'CONFIG_VERSION_CODE' .config || true

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build
        run: make -j"$(nproc)" BUILD_LOG=1

      - name: Pack
        run: |
          mkdir -p release
          tar --zstd -cf release/ponwrt-hg5585f-ct.tar.zst \
            -C bin/targets/airoha an7581
          (cd release && sha256sum *.tar.zst > sha256sums)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-hg5585f-ct
          path: |
            release/*.tar.zst
            release/sha256sums
          if-no-files-found: error
          retention-days: 30

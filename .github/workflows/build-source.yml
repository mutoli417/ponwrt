name: Build PonWrt (Source Repo)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "机型 profile (all=全机型编译)"
        required: true
        default: "fiberhome_hg5585f-ct"
        type: choice
        options:
          - fiberhome_hg5585f-cu
          - fiberhome_hg5585f-ct
          - fiberhome_hg5382a
          - gemtek_xg2010g
          - nokia_xg-040g-md-ubi
          - nokia_xg-040g-tf-ubi
          - unionman_ung00a
          - znxt_zn504xg-d
          - znxt_zn515xg-d
          - h3c_hm2004-du
          - nokia_xg-040g-mf
          - nokia_xg-040g-mf-ubi
          - all

env:
  PROFILE: ${{ github.event.inputs.profile }}
  FW_AUTHOR: "mutoli417"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve device profile
        id: resolve
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          
          # 自动判断 SoC
          if [ "$PROFILE" != "all" ]; then
            case "$PROFILE" in
              nokia_xg-040g-mf*) SOC="an7583" ;;
              *)                  SOC="an7581" ;;
            esac
          else
            SOC="an7581"
          fi
          
          echo "SOC=$SOC" >> "$GITHUB_ENV"
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "DEVICE_NAME=ponwrt-${SOC}-${PROFILE}" >> "$GITHUB_ENV"
          
          echo "========================================"
          echo "SoC      : $SOC"
          echo "Profile  : $PROFILE"
          echo "Source   : 本仓库源码"
          echo "========================================"

      - name: Free disk space & init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # --- 删除预装大件 ---
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo -E apt-get -yqq purge firefox snapd 2>/dev/null || true

          # --- 配置 8G Swap ---
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile

          # --- 安装依赖 ---
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget curl subversion mercurial

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          # 加载 SoC 基座配置
          if [ -f "configs/${SOC}.config" ]; then
            ./scripts/kconfig.pl + "configs/${SOC}.config" > .config
            echo "✅ 已加载 configs/${SOC}.config"
          fi
          
          # 应用机型配置（如果有）
          if [ "$PROFILE" != "all" ]; then
            if [ -f "scripts/gen-${PROFILE}.sh" ]; then
              bash "scripts/gen-${PROFILE}.sh"
            elif [ -f "scripts/gen-hg5585f-config.sh" ] && [[ "$PROFILE" == hg5585f* ]]; then
              bash "scripts/gen-hg5585f-config.sh"
            fi
          fi
          
          # 清空版本号
          sed -i '/^CONFIG_VERSION_CODE=/d' .config 2>/dev/null || true
          sed -i '/^# CONFIG_VERSION_CODE is not set/d' .config 2>/dev/null || true
          echo 'CONFIG_VERSION_CODE=""' >> .config
          
          # 执行 diy-part2.sh 定制
          if [ -f "diy-part2.sh" ]; then
            bash diy-part2.sh
          fi
          
          # 生成最终配置
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE_NAME }}
          path: bin/targets/*/*/*.bin
          retention-days: 30

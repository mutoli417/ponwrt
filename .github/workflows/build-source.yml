name: Build PonWrt (Source Repo)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "机型 profile (all=全机型编译)"
        required: true
        default: "fiberhome_hg5585f-ct"
        type: choice
        options:
          - fiberhome_hg5585f-cu
          - fiberhome_hg5585f-ct
          - fiberhome_hg5382a
          - gemtek_xg2010g
          - nokia_xg-040g-md-ubi
          - nokia_xg-040g-tf-ubi
          - unionman_ung00a
          - znxt_zn504xg-d
          - znxt_zn515xg-d
          - h3c_hm2004-du
          - nokia_xg-040g-mf
          - nokia_xg-040g-mf-ubi
          - all

env:
  PROFILE: ${{ github.event.inputs.profile }}
  FW_AUTHOR: "mutoli417"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve device profile
        id: resolve
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          
          # 自动判断 SoC
          if [ "$PROFILE" != "all" ]; then
            case "$PROFILE" in
              nokia_xg-040g-mf*) SOC="an7583" ;;
              *)                  SOC="an7581" ;;
            esac
          else
            SOC="an7581"
          fi
          
          echo "SOC=$SOC" >> "$GITHUB_ENV"
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "DEVICE_NAME=ponwrt-${SOC}-${PROFILE}" >> "$GITHUB_ENV"
          
          echo "========================================"
          echo "SoC      : $SOC"
          echo "Profile  : $PROFILE"
          echo "Source   : 本仓库源码"
          echo "========================================"

      - name: Free disk space & init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # --- 删除预装大件 ---
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo -E apt-get -yqq purge firefox snapd 2>/dev/null || true

          # --- 配置 8G Swap ---
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile

          # --- 安装依赖 ---
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev \
            file wget curl subversion mercurial

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Pull status plugins
        run: |
          PKG_DIR="package/custom"
          mkdir -p "$PKG_DIR"

          # SSR Plus+：加入 helloworld feed
          grep -q '^src-git helloworld' feeds.conf.default || \
            echo 'src-git helloworld https://github.com/fw876/helloworld.git' >> feeds.conf.default
          ./scripts/feeds update helloworld
          ./scripts/feeds install -a -p helloworld

          # Airoha SoC 状态页（NPU/CPU/Frame Engine/PPE）
          if [ ! -d "$PKG_DIR/luci-app-airoha-npu" ]; then
            echo "--- 克隆 luci-app-airoha-npu ---"
            git clone --depth 1 https://github.com/luanmuc/luci-app-airoha-npu "$PKG_DIR/luci-app-airoha-npu"
            # po 文件名改成 airoha-npu.po（luci.mk 按 LUCI_BASENAME 查找）
            if [ -f "$PKG_DIR/luci-app-airoha-npu/po/zh_Hans/luci-app-airoha-npu.po" ]; then
              mv "$PKG_DIR/luci-app-airoha-npu/po/zh_Hans/luci-app-airoha-npu.po" \
                 "$PKG_DIR/luci-app-airoha-npu/po/zh_Hans/airoha-npu.po"
            fi
          fi

          # natmode + pon-status（来自 qwe-qaq/luci-app monorepo）
          if [ ! -d "$PKG_DIR/luci-app-natmode" ] || [ ! -d "$PKG_DIR/luci-app-pon-status" ]; then
            echo "--- 克隆 luci-app monorepo（natmode + pon-status）---"
            LUCI_APP_TMP="$(mktemp -d)/luci-app"
            git clone --depth 1 -b main https://github.com/qwe-qaq/luci-app "$LUCI_APP_TMP"
            for p in luci-app-natmode luci-app-pon-status; do
              rm -rf "$PKG_DIR/$p"
              cp -r "$LUCI_APP_TMP/$p" "$PKG_DIR/"
            done
            rm -rf "$LUCI_APP_TMP"
          fi

          echo "✅ 状态插件已拉取完成"

          # =========================================================
          # 修复状态插件依赖：去掉缺失的依赖，防止 defconfig 剔除
          # =========================================================
          echo "--- 修复状态插件依赖（去掉缺失的依赖）---"

          # luci-app-airoha-npu: 去掉 @TARGET_airoha 条件
          if [ -f "$PKG_DIR/luci-app-airoha-npu/Makefile" ]; then
            sed -i 's/LUCI_DEPENDS:=+luci-base @TARGET_airoha/LUCI_DEPENDS:=+luci-base/' "$PKG_DIR/luci-app-airoha-npu/Makefile"
            echo "  ✅ luci-app-airoha-npu: 已去掉 @TARGET_airoha"
          fi

          # luci-app-natmode: 去掉 +firewall4 +kmod-nft-fullcone
          if [ -f "$PKG_DIR/luci-app-natmode/Makefile" ]; then
            sed -i 's/LUCI_DEPENDS:=+luci-base +firewall4 +kmod-nft-fullcone/LUCI_DEPENDS:=+luci-base/' "$PKG_DIR/luci-app-natmode/Makefile"
            echo "  ✅ luci-app-natmode: 已去掉 firewall4 + kmod-nft-fullcone"
          fi

          # luci-app-pon-status: 去掉 +luci-mod-status +airoha-ponctl +jsonfilter +rpcd-mod-file
          if [ -f "$PKG_DIR/luci-app-pon-status/Makefile" ]; then
            sed -i 's/LUCI_DEPENDS:=+luci-base +luci-mod-status +airoha-ponctl +jsonfilter +rpcd-mod-file/LUCI_DEPENDS:=+luci-base/' "$PKG_DIR/luci-app-pon-status/Makefile"
            echo "  ✅ luci-app-pon-status: 已去掉所有额外依赖"
          fi

      - name: Cache dl (downloaded packages)
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-dl-${{ hashFiles('configs/*.config') }}
          restore-keys: |
            ${{ runner.os }}-dl-

      - name: Cache build directory (toolchain)
        uses: actions/cache@v4
        with:
          path: build_dir
          key: ${{ runner.os }}-build-${{ hashFiles('configs/*.config') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Load custom configuration
        run: |
          # 加载 SoC 基座配置 + release.config
          if [ -f "configs/${SOC}.config" ]; then
            if [ -f "configs/release.config" ]; then
              ./scripts/kconfig.pl + "configs/${SOC}.config" "configs/release.config" > .config
            else
              ./scripts/kconfig.pl + "configs/${SOC}.config" > .config
            fi
            echo "✅ 已加载 configs/${SOC}.config"
          fi
          
          # 应用机型配置
          if [ "$PROFILE" != "all" ]; then
            # 清除所有机型配置，只保留目标机型
            sed -i '/CONFIG_TARGET_DEVICE_/d; /^CONFIG_TARGET_MULTI_PROFILE=/d' .config
            
            # 自动判断用哪个 gen 脚本
            # hg5585f 和 hg5382a 都用同一个 gen 脚本（它内部有 case 判断）
            if [[ "$PROFILE" == *hg5585f* ]] || [[ "$PROFILE" == *hg5382a* ]]; then
              bash "scripts/gen-hg5585f-config.sh"
            elif [ -f "scripts/gen-${PROFILE}.sh" ]; then
              bash "scripts/gen-${PROFILE}.sh"
            else
              echo "⚠️ 未找到对应 gen 脚本，使用通用配置"
            fi
          fi
          
          # 清空版本号
          sed -i '/^CONFIG_VERSION_CODE=/d' .config 2>/dev/null || true
          sed -i '/^# CONFIG_VERSION_CODE is not set/d' .config 2>/dev/null || true
          echo 'CONFIG_VERSION_CODE=""' >> .config
          
          # 执行 diy-part2.sh 定制
          if [ -f "diy-part2.sh" ]; then
            bash diy-part2.sh
          fi
          
          # 生成最终配置
          make defconfig

          # 强制确保状态插件 + 全部依赖配置正确（防止被 defconfig 剔除）
          echo "🔒 强制确保状态插件 + 全部依赖配置（defconfig 后）..."
          for pkg in luci-app-airoha-npu luci-app-pon-status luci-app-natmode; do
            sed -i "/$pkg/d" .config 2>/dev/null || true
            echo "CONFIG_PACKAGE_$pkg=y" >> .config
          done
          for pkg in firewall4 kmod-nft-fullcone luci-mod-status airoha-ponctl jsonfilter rpcd-mod-file; do
            sed -i "/$pkg/d" .config 2>/dev/null || true
            echo "CONFIG_PACKAGE_$pkg=y" >> .config
          done

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE_NAME }}
          path: bin/targets/*/*/*.bin
          retention-days: 30
